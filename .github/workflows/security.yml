name: Security checks

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify lockfile install
        run: npm ci

      - name: Check Server Action guards
        run: npm run security:actions

      - name: Verify vendored dependency checksum
        run: npm run security:vendor

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify generated Cloudflare bindings
        run: npm run cloudflare:types:check

      - name: Scan complete Git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
