<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0d4f4a" />
    <title>Offline | MANSATAS App</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        color: #0f172a; background: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main {
        width: min(100%, 420px); padding: 28px; border: 1px solid #e2e8f0;
        border-radius: 18px; background: #fff; text-align: center;
        box-shadow: 0 12px 36px rgba(15, 23, 42, .07);
      }
      .mark {
        display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 16px;
        border-radius: 14px; color: #fff; background: #0f766e; font-size: 24px;
      }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 10px 0 20px; color: #64748b; font-size: 14px; line-height: 1.6; }
      button {
        border: 0; border-radius: 10px; padding: 11px 18px; color: #fff;
        background: #0f766e; font-weight: 700; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">!</div>
      <h1>Perangkat sedang offline</h1>
      <p>
        MANSATAS App memerlukan koneksi internet untuk mengambil data madrasah terbaru.
        Periksa jaringan, lalu coba kembali.
      </p>
      <button type="button" onclick="retry()">Coba Lagi</button>
    </main>
    <script>
      function retry() {
        var isLocalAsset = window.location.origin.includes('localhost') || window.location.protocol === 'file:';
        window.location.href = isLocalAsset ? 'https://app.mansatas.com/' : '/';
      }
      window.addEventListener('online', retry);
      setInterval(function() {
        if (navigator.onLine) retry();
      }, 4000);
    </script>
  </body>
</html>
